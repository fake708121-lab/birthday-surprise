<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="bg-hearts"></div>

<!-- Music Control -->
<div class="music-control">
<button id="musicToggle" title="Toggle Music">🎵</button>
<audio id="bgMusic" loop crossorigin="anonymous">
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
</div>

<div class="birthday-card">

<div class="cake">
<!-- Animated cake emoji -->
<div id="cakeEmoji" class="cake-emoji">🎂</div>
</div>

<h1 id="title"></h1>

<p id="message">
Today is not just another day...<br><br>

It's the day someone incredibly special came into this world.

May your smile never fade,
your dreams always come true,
and your heart always stay full of happiness.

Happy Birthday Rakshu ❤️
</p>

<button id="nextBtn" class="glow-button">
✨ Start the Celebration 🎈
</button>

</div>

<script src="script.js"></script>
</body>
</html>
