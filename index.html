<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

<div class="bg-hearts"></div>
<div class="floating-elements">
  <div class="float-item">🎂</div>
  <div class="float-item">❤️</div>
  <div class="float-item">🎉</div>
  <div class="float-item">✨</div>
</div>

<!-- Music Control -->
<div class="music-control">
<button id="musicToggle" title="Toggle Music">🎵</button>
<audio id="bgMusic" loop crossorigin="anonymous">
<source src="https://assets.mixkit.co/active_storage/sfx/2455/2455-preview.mp3" type="audio/mpeg">
</audio>
</div>

<div class="birthday-card premium">

<div class="cake-container">
<!-- Animated cake emoji -->
<div id="cakeEmoji" class="cake-emoji">🎂</div>
</div>

<div class="content">
<h1 id="title" class="title-animate"></h1>

<p id="message" class="message-text">
Today is not just another day...<br><br>

It's the day someone incredibly special came into this world.

<br><br>
May your smile never fade,
your dreams always come true,
and your heart always stay full of happiness.

<br><br>
<span class="highlight">Happy Birthday Rakshu ❤️</span>
</p>

<button id="nextBtn" class="glow-button premium-btn">
✨ Start the Celebration 🎈
</button>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
