<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flowers For You 🌹</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ffd6e7,#fff5f9);

overflow:hidden;

}

.card{

width:350px;

background:white;

padding:35px;

border-radius:25px;

text-align:center;

box-shadow:0 20px 40px rgba(255,105,180,.25);

z-index:10;

}

.bouquet{

font-size:130px;

animation:float 2s ease-in-out infinite;

}

h1{

color:#ff2d75;

margin:20px 0;

}

p{

color:#555;

line-height:1.7;

margin-bottom:25px;

}

button{

padding:14px 30px;

border:none;

border-radius:50px;

background:#ff4f8b;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

.heart{

position:absolute;

color:#ff5c8d;

font-size:24px;

animation:fall linear infinite;

opacity:.7;

}

@keyframes float{

0%,100%{transform:translateY(0);}

50%{transform:translateY(-15px);}

}

@keyframes fall{

from{

transform:translateY(-100px);

}

to{

transform:translateY(110vh);

}

}

</style>

</head>

<body>

<div class="card">

<div class="bouquet">🌹💐</div>

<h1>Flowers For You ❤️</h1>

<p>

Every flower reminds me of your beautiful smile.

May your life always bloom with happiness and love.

</p>

<button onclick="nextPage()">

Read My Letter 💌

</button>

</div>

<script>

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},9000);

}

setInterval(createHeart,300);

function nextPage(){

window.location="letter.html";

}

</script>

</body>

</html>
