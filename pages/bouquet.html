<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers 🌹</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

.phone-screen {
  width: 400px;
  height: 800px;
  background: linear-gradient(135deg, #fad0d7, #ffc7d9);
  border-radius: 50px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(255, 79, 139, 0.4), 0 0 40px rgba(0, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 25px;
  background: #fad0d7;
  border-radius: 0 0 25px 25px;
  z-index: 100;
}

.screen-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #ffd6e7, #ffe2ec, #fff5f9);
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.content-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 2;
}

.card {
  width: 85%;
  height: 70%;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  animation: slide-up 0.8s ease;
  text-align: center;
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  color: #ff4f8b;
  font-size: 32px;
  font-weight: 700;
  margin: 15px 0;
  font-style: italic;
}

.flowers {
  font-size: 80px;
  margin: 20px 0;
  animation: sway 3s ease-in-out infinite;
}

@keyframes sway {
  0%, 100% { transform: rotateZ(-5deg) scale(1); }
  50% { transform: rotateZ(5deg) scale(1.05); }
}

p {
  color: #555;
  font-size: 16px;
  line-height: 1.7;
  margin: 15px 0;
}

button {
  margin-top: 25px;
  padding: 14px 35px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #ff4f8b, #ff8fb3);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 79, 139, 0.4);
  transition: all 0.3s ease;
  font-family: 'Fredoka', sans-serif;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 30px rgba(255, 79, 139, 0.6);
}

.heart {
  position: absolute;
  color: #ff5c8d;
  font-size: 20px;
  animation: fall linear infinite;
  opacity: 0.5;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(800px); }
}

</style>
</head>

<body>

<div class="phone-screen">
  <div class="notch"></div>
  <div class="screen-content">
    <div class="content-container">
      <div class="card">
        <div class="flowers">🌹💐</div>
        <h1>Flowers For You</h1>
        <p>Every flower reminds me of your beautiful smile and the joy you bring into my life.</p>
        <button onclick="nextPage()">
          💌 Read My Letter
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function createHeart(){
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random()*100+"vw";
  heart.style.animationDuration = (4+Math.random()*5)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{ heart.remove(); }, 9000);
}

setInterval(createHeart, 400);

function nextPage(){
  document.body.style.opacity="0";
  document.body.style.transition="opacity 0.5s ease";
  setTimeout(() => {
    window.location="letter.html";
  }, 500);
}
</script>
</body>
</html>
