<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers For You 🌹</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#ffcce0,#ffe2ec);
background-size: 400% 400%;
overflow:hidden;
animation: bgShift 12s ease infinite;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card{
width:400px;
background:rgba(255, 255, 255, 0.4);
backdrop-filter: blur(20px);
padding:50px;
border-radius:30px;
text-align:center;
box-shadow:0 20px 60px rgba(255,105,180,.3);
border: 2px solid rgba(255, 255, 255, 0.6);
animation: slideUp 0.8s ease;
z-index:10;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

.bouquet{
font-size:140px;
margin:20px 0;
animation:sway 3s ease-in-out infinite;
}

@keyframes sway {
  0%, 100% { transform: rotateZ(-5deg) scale(1); }
  50% { transform: rotateZ(5deg) scale(1.05); }
}

h1{
color:#ff2d75;
font-size: 42px;
font-weight: 800;
margin:25px 0;
background: linear-gradient(135deg, #ff2d75, #ff6fa6);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

p{
color:#555;
line-height:1.8;
margin:20px 0;
font-size: 16px;
}

button{
padding:16px 40px;
border:none;
border-radius:50px;
background:linear-gradient(135deg, #ff4f8b, #ff8fb3);
color:white;
font-size:18px;
font-weight: 700;
cursor:pointer;
margin-top: 30px;
box-shadow: 0 10px 30px rgba(255, 79, 139, 0.5);
transition: all 0.3s ease;
}

button:hover{
transform:scale(1.1);
box-shadow: 0 15px 40px rgba(255, 79, 139, 0.8);
}

.heart{
position:absolute;
color:#ff5c8d;
font-size:24px;
animation:fall linear infinite;
opacity:.5;
}

@keyframes fall{
from{ transform:translateY(-100px); }
to{ transform:translateY(110vh); }
}

</style>

</head>
<body>

<div class="card">
<div class="bouquet">🌹💐</div>

<h1>Flowers For You</h1>

<p>
Every flower reminds me of your beautiful smile and the joy you bring into my life.
<br><br>
May your life always bloom with happiness, love, and endless blessings.
</p>

<button onclick="nextPage()">
💌 Read My Letter
</button>
</div>

<script>
function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(4+Math.random()*5)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{ heart.remove(); },9000);
}

setInterval(createHeart,400);

function nextPage(){
  document.body.style.opacity="0";
  document.body.style.transition="opacity 0.5s ease";
  setTimeout(() => {
    window.location="letter.html";
  }, 500);
}
</script>

</body>
</html>
