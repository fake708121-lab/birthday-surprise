<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blow Candle 🕯️</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

.phone-screen {
  width: 400px;
  height: 800px;
  background: linear-gradient(135deg, #fad0d7, #ffc7d9);
  border-radius: 50px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(255, 79, 139, 0.4), 0 0 40px rgba(0, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 25px;
  background: #fad0d7;
  border-radius: 0 0 25px 25px;
  z-index: 100;
}

.screen-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #ffd6e7, #ffe2ec, #fff5f9);
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.content-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 2;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 350px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 30px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  animation: slide-up 0.8s ease;
  text-align: center;
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  color: #ff4f8b;
  font-size: 32px;
  font-weight: 700;
  margin: 15px 0;
  word-wrap: break-word;
}

.candle {
  font-size: 100px;
  margin: 20px 0;
  animation: flicker 0.5s ease-in-out infinite;
}

@keyframes flicker {
  0%, 100% { text-shadow: 0 5px 20px rgba(255, 200, 0, 0.6); }
  50% { text-shadow: 0 5px 40px rgba(255, 150, 0, 0.9); }
}

p {
  color: #555;
  font-size: 15px;
  line-height: 1.6;
  margin: 15px 0;
  word-wrap: break-word;
}

button {
  margin-top: 20px;
  padding: 12px 30px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #ff4f8b, #ff8fb3);
  color: white;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 79, 139, 0.4);
  transition: all 0.3s ease;
  font-family: 'Fredoka', sans-serif;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 30px rgba(255, 79, 139, 0.6);
}

</style>
</head>

<body>

<div class="phone-screen">
  <div class="notch"></div>
  <div class="screen-content">
    <div class="content-container">
      <div class="card">
        <h1>🎂 Make a Wish</h1>
        <div class="candle">🕯️</div>
        <p>Click the button and blow air into your microphone to blow out the candle!</p>
        <button onclick="startMic()">🎤 Blow the Candle</button>
      </div>
    </div>
  </div>
</div>

<script>
let timeoutId;

async function startMic(){
  // Clear any existing timeout
  if(timeoutId) clearTimeout(timeoutId);
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const mic = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();
    mic.connect(analyser);
    analyser.fftSize = 256;
    
    const data = new Uint8Array(analyser.frequencyBinCount);
    let detectionStartTime = Date.now();
    let detected = false;
    
    function detect(){
      analyser.getByteFrequencyData(data);
      let volume = data.reduce((a,b)=>a+b)/data.length;
      
      // Lower threshold for better detection
      if(volume > 8 && !detected){
        detected = true;
        stream.getTracks().forEach(track => track.stop());
        audioContext.close();
        
        confetti({
          particleCount: 300,
          spread: 200
        });
        
        document.querySelector(".card").innerHTML = `
          <h1>🎉 Wish Granted! 🎉</h1>
          <div style="font-size:80px; margin: 20px 0; animation: bounce 2s ease-in-out infinite;">💨🎂</div>
          <p style="font-size: 18px; font-weight: 600; color: #ff4f8b;">Your birthday wish has been sent to the stars!</p>
        `;
        
        setTimeout(() => {
          window.location.href="./bouquet.html";
        }, 2500);
        return;
      }
      
      // Auto-advance after 5 seconds if no blow detected
      if(Date.now() - detectionStartTime > 5000 && !detected){
        stream.getTracks().forEach(track => track.stop());
        audioContext.close();
        
        confetti({
          particleCount: 300,
          spread: 200
        });
        
        document.querySelector(".card").innerHTML = `
          <h1>🎉 Wish Granted! 🎉</h1>
          <div style="font-size:80px; margin: 20px 0; animation: bounce 2s ease-in-out infinite;">💨🎂</div>
          <p style="font-size: 18px; font-weight: 600; color: #ff4f8b;">Your birthday wish has been sent to the stars!</p>
        `;
        
        setTimeout(() => {
          window.location.href="./bouquet.html";
        }, 2500);
        return;
      }
      
      requestAnimationFrame(detect);
    }
    
    detect();
    
  } catch(err) {
    // Auto-advance even if microphone denied
    alert('Using auto-advance instead...');
    
    confetti({
      particleCount: 300,
      spread: 200
    });
    
    document.querySelector(".card").innerHTML = `
      <h1>🎉 Wish Granted! 🎉</h1>
      <div style="font-size:80px; margin: 20px 0; animation: bounce 2s ease-in-out infinite;">💨🎂</div>
      <p style="font-size: 18px; font-weight: 600; color: #ff4f8b;">Your birthday wish has been sent to the stars!</p>
    `;
    
    setTimeout(() => {
      window.location.href="./bouquet.html";
    }, 2500);
  }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
</script>
</body>
</html>
