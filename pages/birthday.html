<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #ffcce0, #ffe2ec, #fff5fb);
  background-size: 400% 400%;
  animation: bgShift 12s ease infinite;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.birthday-card {
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(20px);
  padding: 60px 50px;
  border-radius: 30px;
  text-align: center;
  width: 420px;
  box-shadow: 0 20px 70px rgba(255, 105, 180, 0.3);
  border: 2px solid rgba(255, 255, 255, 0.6);
  animation: slideInUp 0.8s ease;
  z-index: 10;
}

@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(60px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.emoji-container {
  font-size: 100px;
  margin: 20px 0;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

h1 {
  color: #ff2d75;
  font-size: 42px;
  font-weight: 800;
  margin: 20px 0;
  background: linear-gradient(135deg, #ff2d75, #ff6fa6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

h2 {
  color: #ff6699;
  font-size: 32px;
  font-weight: 700;
  margin: 15px 0;
}

p {
  color: #555;
  font-size: 17px;
  line-height: 1.8;
  margin: 20px 0;
}

button {
  margin-top: 30px;
  padding: 16px 40px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff4f8b, #ff8fb3);
  color: white;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 10px 30px rgba(255, 79, 139, 0.5);
  transition: all 0.3s ease;
  animation: pulse-btn 2s ease-in-out infinite;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 15px 40px rgba(255, 79, 139, 0.8);
}

@keyframes pulse-btn {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

</style>

</head>
<body>

<div class="birthday-card">

<div class="emoji-container">🎂🎉</div>

<h1>Happy Birthday</h1>

<h2 id="name">My Love ❤️</h2>

<p>
Today is all about celebrating your beautiful smile, your kind heart, and every wonderful moment you bring into my life.
</p>

<button id="next">
✨ Continue ➜
</button>

</div>

<script>
confetti({
  particleCount: 300,
  spread: 200,
  origin: { y: 0.3 }
});

document.getElementById("next").addEventListener("click", function(){
  confetti({
    particleCount: 200,
    spread: 150
  });
  document.body.style.opacity = "0";
  document.body.style.transition = "opacity 0.5s ease";
  setTimeout(() => {
    window.location.href = "./balloons.html";
  }, 500);
});
</script>

</body>
</html>
