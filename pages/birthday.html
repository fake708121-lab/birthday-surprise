<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

.phone-screen {
  width: 400px;
  height: 800px;
  background: linear-gradient(135deg, #fad0d7, #ffc7d9);
  border-radius: 50px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(255, 79, 139, 0.4), 0 0 40px rgba(0, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 25px;
  background: #fad0d7;
  border-radius: 0 0 25px 25px;
  z-index: 100;
}

.screen-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #ffd6e7, #ffe2ec, #fff5f9);
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.floating-hearts {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

.floating-hearts span {
  position: absolute;
  font-size: 24px;
  opacity: 0.3;
  animation: float-around 6s ease-in-out infinite;
}

.floating-hearts span:nth-child(1) { left: 15%; top: 20%; animation-delay: 0s; }
.floating-hearts span:nth-child(2) { right: 20%; top: 30%; animation-delay: 1s; }
.floating-hearts span:nth-child(3) { left: 25%; bottom: 30%; animation-delay: 2s; }

@keyframes float-around {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
  50% { transform: translateY(-20px) scale(1.1); opacity: 0.5; }
}

.content-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 2;
}

.card {
  width: 85%;
  height: 70%;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  animation: slide-up 0.8s ease;
  text-align: center;
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.emoji {
  font-size: 80px;
  margin: 15px 0;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

h1 {
  color: #ff4f8b;
  font-size: 36px;
  font-weight: 700;
  margin: 20px 0;
  font-style: italic;
}

h2 {
  color: #ff6fa6;
  font-size: 28px;
  font-weight: 600;
  margin: 10px 0;
}

p {
  color: #555;
  font-size: 16px;
  line-height: 1.7;
  margin: 15px 0;
}

button {
  margin-top: 25px;
  padding: 14px 35px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #ff4f8b, #ff8fb3);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 79, 139, 0.4);
  transition: all 0.3s ease;
  font-family: 'Fredoka', sans-serif;
  animation: pulse 2s ease-in-out infinite;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 30px rgba(255, 79, 139, 0.6);
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}

</style>
</head>

<body>

<div class="phone-screen">
  <div class="notch"></div>
  <div class="screen-content">
    <div class="floating-hearts">
      <span>💕</span>
      <span>💕</span>
      <span>💕</span>
    </div>
    
    <div class="content-container">
      <div class="card">
        <div class="emoji">🎂🎉</div>
        <h1>Happy Birthday</h1>
        <h2>My Love ❤️</h2>
        <p>Today is all about celebrating your beautiful smile, your kind heart, and every wonderful moment you bring into my life.</p>
        <button onclick="navigate()">✨ Continue ➜</button>
      </div>
    </div>
  </div>
</div>

<script>
confetti({
  particleCount: 300,
  spread: 200,
  origin: { y: 0.3 }
});

function navigate() {
  confetti({
    particleCount: 200,
    spread: 150
  });
  document.body.style.opacity = '0';
  document.body.style.transition = 'opacity 0.5s ease';
  setTimeout(() => {
    window.location.href = './balloons.html';
  }, 500);
}
</script>
</body>
</html>
