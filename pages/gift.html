<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Gift 🎁</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e7,#fff5fb);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
text-align:center;
}

.card{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 20px 50px rgba(255,105,180,.25);
width:360px;
z-index:5;
}

#gift{
font-size:120px;
cursor:pointer;
animation:bounce 1.5s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-15px);}
}

#surprise{
display:none;
animation:fade .8s;
}

#photo{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:6px solid #ff4f8b;
margin:20px auto;
display:block;
}

h1{
color:#ff2d75;
}

p{
margin-top:15px;
line-height:1.7;
color:#555;
}

@keyframes fade{
from{
opacity:0;
transform:scale(.8);
}
to{
opacity:1;
transform:scale(1);
}
}

</style>
</head>

<body>

<div class="card">

<div id="gift" onclick="openGift()">
🎁
</div>

<div id="surprise">

<img id="photo" src="../assets/images/photo.jpg">

<h1>Happy Birthday ❤️</h1>

<p>

May every dream of yours come true.

May your smile always shine brighter than the stars.

Thank you for being the most beautiful part of my life.

🎂❤️🎉

</p>

</div>

</div>

<script>

function openGift(){

document.getElementById("gift").style.display="none";

document.getElementById("surprise").style.display="block";

confetti({
particleCount:350,
spread:180,
origin:{y:.6}
});

}

</script>

</body>
</html>
