<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter 💌</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

.phone-screen {
  width: 400px;
  height: 800px;
  background: linear-gradient(135deg, #fad0d7, #ffc7d9);
  border-radius: 50px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(255, 79, 139, 0.4), 0 0 40px rgba(0, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 25px;
  background: #fad0d7;
  border-radius: 0 0 25px 25px;
  z-index: 100;
}

.screen-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #ffd6e7, #ffe2ec, #fff5f9);
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.content-container {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  z-index: 2;
}

.card {
  width: 85%;
  height: 70%;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  box-shadow: 0 15px 40px rgba(255, 105, 180, 0.25);
  animation: slide-up 0.8s ease;
  text-align: center;
  overflow-y: auto;
}

@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(50px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.envelope {
  font-size: 90px;
  cursor: pointer;
  margin: 20px 0;
  transition: all 0.4s ease;
  animation: bounce 2s ease-in-out infinite;
  display: block;
}

.envelope:hover {
  transform: scale(1.15) rotateZ(-10deg);
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

h2 {
  color: #ff4f8b;
  font-size: 24px;
  font-weight: 700;
  margin: 15px 0;
}

#letter {
  display: none;
  font-size: 15px;
  line-height: 1.8;
  color: #555;
  text-align: left;
  margin: 20px 0;
  padding: 20px;
  background: rgba(255, 79, 139, 0.05);
  border-radius: 15px;
  max-height: 300px;
  overflow-y: auto;
  animation: fade-in 0.6s ease;
}

@keyframes fade-in {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

button {
  display: none;
  margin-top: 20px;
  padding: 14px 35px;
  border: none;
  border-radius: 25px;
  background: linear-gradient(135deg, #ff4f8b, #ff8fb3);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(255, 79, 139, 0.4);
  transition: all 0.3s ease;
  font-family: 'Fredoka', sans-serif;
  animation: fade-in 0.6s ease;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 12px 30px rgba(255, 79, 139, 0.6);
}

.heart {
  position: absolute;
  color: #ff4f8b;
  font-size: 20px;
  animation: fall linear infinite;
  opacity: 0.6;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(800px); }
}

</style>
</head>

<body>

<div class="phone-screen">
  <div class="notch"></div>
  <div class="screen-content">
    <div class="content-container">
      <div class="card">
        <div class="envelope" onclick="openLetter()">💌</div>
        <h2 id="heading">Tap the Envelope</h2>
        <div id="letter"></div>
        <button id="giftBtn" onclick="location.href='gift.html'">
          🎁 Open Your Gift
        </button>
      </div>
    </div>
  </div>
</div>

<script>

const text=`Happy Birthday ❤️

Today is not just your birthday...

It is the day the world became more beautiful because you came into it.

Thank you for your smile, your kindness and every beautiful memory we share.

I wish your dreams come true and happiness follows you forever.

Happy Birthday, My Love. ❤️`;

let i=0;

function openLetter(){
  document.querySelector(".envelope").style.display="none";
  document.getElementById("heading").style.display="none";
  document.getElementById("letter").style.display="block";
  type();
}

function type(){
  if(i<text.length){
    document.getElementById("letter").innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,40);
  }else{
    document.getElementById("giftBtn").style.display="inline-block";
    confetti({ particleCount: 200, spread: 150 });
  }
}

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

setInterval(createHeart,350);

</script>
</body>
</html>
