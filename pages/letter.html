<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Letter ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg, #ffd6e7, #ffcce0, #ffe2ec, #fff5fb);
background-size: 400% 400%;
overflow:hidden;
animation: bgShift 12s ease infinite;
}

@keyframes bgShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.card{
width:420px;
background:rgba(255, 255, 255, 0.4);
backdrop-filter: blur(20px);
padding:50px;
border-radius:30px;
text-align:center;
box-shadow:0 20px 60px rgba(255,105,180,.3);
border: 2px solid rgba(255, 255, 255, 0.6);
z-index:10;
animation: slideUp 0.8s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(50px); }
  to { opacity: 1; transform: translateY(0); }
}

.envelope{
font-size:100px;
cursor:pointer;
transition:.4s;
margin: 20px 0;
display: inline-block;
animation: bounce 2s ease-in-out infinite;
}

.envelope:hover{
transform:scale(1.2) rotateZ(-10deg);
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

h2{
color:#ff2d75;
font-size: 32px;
font-weight: 800;
margin-bottom: 20px;
}

#letter{
display:none;
margin-top:20px;
text-align:left;
font-size:16px;
line-height:1.9;
color:#444;
min-height:250px;
white-space:pre-wrap;
background: rgba(255, 255, 255, 0.6);
padding: 25px;
border-radius: 20px;
box-shadow: 0 5px 20px rgba(255, 105, 180, 0.1);
}

button{
display:none;
margin-top:25px;
padding:16px 40px;
border:none;
border-radius:50px;
background:linear-gradient(135deg, #ff4f8b, #ff8fb3);
color:white;
font-size:18px;
font-weight: 700;
cursor:pointer;
box-shadow: 0 10px 30px rgba(255, 79, 139, 0.5);
transition: all 0.3s ease;
}

button:hover{
transform:scale(1.1);
box-shadow: 0 15px 40px rgba(255, 79, 139, 0.8);
}

.heart{
position:absolute;
color:#ff4f8b;
font-size:24px;
animation:fall linear infinite;
opacity:.6;
}

@keyframes fall{
from{ transform:translateY(-100px); }
to{ transform:translateY(110vh); }
}

</style>

</head>
<body>

<div class="card">

<div class="envelope" onclick="openLetter()">
💌
</div>

<h2>Tap the Envelope</h2>

<div id="letter"></div>

<button id="giftBtn" onclick="location.href='gift.html'">
🎁 Open Your Gift
</button>

</div>

<script>

const text=`Happy Birthday ❤️

Today is not just your birthday...

It is the day the world became more beautiful because you came into it.

Thank you for your smile, your kindness and every beautiful memory we share.

I wish your dreams come true and happiness follows you forever.

Happy Birthday, My Love. ❤️`;

let i=0;

function openLetter(){
  document.querySelector(".envelope").style.display="none";
  document.querySelector("h2").style.display="none";
  document.getElementById("letter").style.display="block";
  type();
}

function type(){
  if(i<text.length){
    document.getElementById("letter").innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,40);
  }else{
    document.getElementById("giftBtn").style.display="inline-block";
    confetti({ particleCount: 200, spread: 150 });
  }
}

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),8000);
}

setInterval(createHeart,350);

</script>

</body>
</html>
