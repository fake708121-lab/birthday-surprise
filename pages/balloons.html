<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Balloons 🎈</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #0a0a1a;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Fredoka', sans-serif;
  overflow: hidden;
}

.phone-screen {
  width: 400px;
  height: 800px;
  background: linear-gradient(135deg, #fad0d7, #ffc7d9);
  border-radius: 50px;
  padding: 12px;
  box-shadow: 0 20px 60px rgba(255, 79, 139, 0.4), 0 0 40px rgba(0, 0, 0, 0.3);
  position: relative;
  overflow: hidden;
}

.notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 25px;
  background: #fad0d7;
  border-radius: 0 0 25px 25px;
  z-index: 100;
}

.screen-content {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #ffd6e7 0%, #ffe2ec 50%, #fff5f9 100%);
  border-radius: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.header {
  position: absolute;
  top: 30px;
  text-align: center;
  z-index: 10;
}

.title {
  font-size: 28px;
  font-weight: 700;
  color: #ff4f8b;
  margin-bottom: 10px;
}

.progress {
  font-size: 16px;
  color: #d81b60;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.6);
  padding: 8px 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
}

.balloons-container {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 150px 30px 50px;
}

.balloon {
  width: 90px;
  height: 120px;
  border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
  cursor: pointer;
  position: relative;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.15));
  transition: transform 0.2s ease;
  animation: float-up 3s ease-in infinite;
}

.balloon:hover {
  transform: scale(1.1);
}

.balloon::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 50px;
  background: #333;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
}

@keyframes float-up {
  0% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1); }
  100% { transform: translateY(0) scale(1); }
}

.balloon.pink { background: linear-gradient(135deg, #ff4f8b 0%, #ff8fb3 100%); }
.balloon.green { background: linear-gradient(135deg, #7ec7e8 0%, #a8e6b8 100%); }
.balloon.purple { background: linear-gradient(135deg, #c9b8ff 0%, #e8b4ff 100%); }
.balloon.yellow { background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); }

.balloon.pop {
  animation: pop 0.4s ease;
}

@keyframes pop {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0) rotate(360deg); opacity: 0; }
}

</style>
</head>

<body>

<div class="phone-screen">
  <div class="notch"></div>
  <div class="screen-content">
    <div class="header">
      <div class="title">🎈 Pop Balloons 🎈</div>
      <div class="progress"><span id="popped">0</span> / 4 POPPED</div>
    </div>
    
    <div class="balloons-container" id="balloonsContainer"></div>
  </div>
</div>

<script>
let popped = 0;
const total = 4;
const colors = ['pink', 'green', 'purple', 'yellow'];

function createBalloon(color) {
  const container = document.getElementById('balloonsContainer');
  const balloon = document.createElement('div');
  balloon.className = `balloon ${color}`;
  
  balloon.onclick = function() {
    if (this.classList.contains('pop')) return;
    this.classList.add('pop');
    popped++;
    document.getElementById('popped').textContent = popped;
    
    if (popped >= total) {
      setTimeout(() => {
        window.location.href = 'candle.html';
      }, 1000);
    }
  };
  
  container.appendChild(balloon);
}

// Create balloons
colors.forEach(color => createBalloon(color));
</script>
</body>
</html>
