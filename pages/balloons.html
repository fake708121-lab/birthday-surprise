<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop the Balloons 🎈</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
overflow:hidden;
background:linear-gradient(180deg,#ffd6e7,#ffeef5);
font-family:Poppins,sans-serif;
}

h1{
position:absolute;
top:20px;
width:100%;
text-align:center;
color:#ff2d75;
z-index:100;
}

#count{
position:absolute;
top:70px;
width:100%;
text-align:center;
font-size:22px;
font-weight:bold;
color:#d81b60;
z-index:100;
}

.balloon{

position:absolute;
bottom:-120px;

width:70px;
height:90px;

border-radius:50% 50% 45% 45%;

cursor:pointer;

animation:float linear forwards;

}

.balloon::after{

content:"";

position:absolute;

width:2px;
height:60px;

background:#555;

left:34px;
top:90px;

}

@keyframes float{

from{
transform:translateY(0);
}

to{
transform:translateY(-140vh);
}

}

</style>

</head>

<body>

<h1>🎈 Pop All Balloons 🎈</h1>

<div id="count">
0 / 20
</div>

<script>

let popped = 0;
const total = 20;

const colors = [
"#ff4f8b",
"#ff6fa6",
"#ff99bb",
"#ff2d75",
"#ff4081"
];

function createBalloon(){

if(popped >= total) return;

const b = document.createElement("div");

b.className = "balloon";

b.style.background = colors[Math.floor(Math.random()*colors.length)];

b.style.left = Math.random()*85 + "%";

// Much slower movement
b.style.animationDuration = (12 + Math.random()*8) + "s";

document.body.appendChild(b);

b.onclick = function(){

this.remove();

popped++;

document.getElementById("count").innerHTML =
popped + " / " + total;

// Create another balloon until all are popped
if(popped < total){
createBalloon();
}else{
setTimeout(()=>{
window.location.href="candle.html";
},1000);
}

};

// Remove balloon only if it escapes
b.addEventListener("animationend",()=>{
if(document.body.contains(b)){
b.remove();
createBalloon();
}
});

}

// Show only 6 balloons at a time
for(let i=0;i<6;i++){
createBalloon();
}

</script>

</body>
</html>
