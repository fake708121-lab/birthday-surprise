<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop the Balloons 🎈</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
margin:0;
overflow:hidden;
background:linear-gradient(180deg,#ffd6e7,#ffeef5,#ffe2ec);
font-family:'Poppins',sans-serif;
}

h1{
position:absolute;
top:30px;
width:100%;
text-align:center;
color:#ff2d75;
z-index:100;
font-size:42px;
font-weight:800;
letter-spacing:2px;
text-shadow: 0 3px 10px rgba(255, 79, 139, 0.3);
}

#count{
position:absolute;
top:90px;
width:100%;
text-align:center;
font-size:26px;
font-weight:700;
color:#d81b60;
z-index:100;
background: rgba(255, 255, 255, 0.5);
padding: 10px;
border-radius: 50px;
width: 150px;
left: 50%;
transform: translateX(-50%);
backdrop-filter: blur(10px);
box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
}

.balloon{
position:absolute;
bottom:-120px;
width:75px;
height:95px;
border-radius:50% 50% 45% 45%;
cursor:pointer;
animation:float linear forwards;
box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
transition: transform 0.2s ease;
}

.balloon:hover{
transform: scale(1.1);
}

.balloon::after{
content:"";
position:absolute;
width:2px;
height:65px;
background:#555;
left:36.5px;
top:95px;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

@keyframes float{
from{
transform:translateY(0);
}
to{
transform:translateY(-140vh);
}
}

/* Pop animation */
@keyframes pop {
0% { transform: scale(1); }
100% { transform: scale(0); opacity: 0; }
}

.balloon.popped {
animation: pop 0.3s ease;
}

</style>

</head>

<body>

<h1>🎈 Pop All Balloons 🎈</h1>

<div id="count">
0 / 20
</div>

<script>

let popped = 0;
const total = 20;

const colors = [
"#ff4f8b",
"#ff6fa6",
"#ff99bb",
"#ff2d75",
"#ff4081",
"#ff85a8"
];

function createBalloon(){

if(popped >= total) return;

const b = document.createElement("div");
b.className = "balloon";
b.style.background = colors[Math.floor(Math.random()*colors.length)];
b.style.left = Math.random()*85 + "%";
b.style.animationDuration = (12 + Math.random()*8) + "s";

document.body.appendChild(b);

b.onclick = function(e){
e.stopPropagation();
if(this.classList.contains('popped')) return;
this.classList.add('popped');

popped++;
document.getElementById("count").innerHTML = popped + " / " + total;

if(popped < total){
setTimeout(() => createBalloon(), 200);
}else{
setTimeout(()=>{
window.location.href="candle.html";
},1500);
}
};

b.addEventListener("animationend",()=>{
if(document.body.contains(b)){
b.remove();
if(popped < total) createBalloon();
}
});

}

for(let i=0;i<6;i++){
createBalloon();
}

</script>

</body>
</html>
